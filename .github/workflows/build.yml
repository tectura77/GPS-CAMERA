name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.example --project-name gps_camera --platforms=android .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Configure Android Permissions & Naver Map & Gradle
        run: |
          python3 - << 'EOF'
          import glob, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
          """
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", perms + "\n    <application", 1)

          meta = """
                  <meta-data
                      android:name="com.naver.maps.map.CLIENT_ID"
                      android:value="b3agnvaern" />
          """
          if "com.naver.maps.map.CLIENT_ID" not in content:
              content = content.replace("</activity>", "</activity>\n" + meta, 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          for gpath in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              try:
                  with open(gpath, "r", encoding="utf-8") as f:
                      g = f.read()
                  g = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 23", g)
                  g = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", g)
                  with open(gpath, "w", encoding="utf-8") as f:
                      f.write(g)
              except FileNotFoundError:
                  pass
          EOF

      - name: Inject Shutter Sound into MainActivity.kt
        run: |
          python3 - << 'EOF'
          import glob

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_path = kt_files[0]
              with open(kt_path, "r", encoding="utf-8") as f:
                  first_line = f.readline().strip()
              pkg_line = first_line if first_line.startswith("package ") else "package com.example.gps_camera"

              kt_code = pkg_line + """

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaActionSound
          import android.media.MediaPlayer
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "gps_camera/shutter"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "playShutter") {
                          val wavBytes = call.argument<ByteArray>("wav")
                          playShutterOnAlarmStream(wavBytes)
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun playShutterOnAlarmStream(wavBytes: ByteArray?) {
                  try {
                      val actionSound = MediaActionSound()
                      actionSound.play(MediaActionSound.SHUTTER_CLICK)

                      if (wavBytes != null) {
                          val tempFile = File(cacheDir, "shutter_click.wav")
                          FileOutputStream(tempFile).use { it.write(wavBytes) }

                          val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM)
                          val curVol = audioManager.getStreamVolume(AudioManager.STREAM_ALARM)
                          if (curVol == 0) {
                              audioManager.setStreamVolume(
                                  AudioManager.STREAM_ALARM,
                                  (maxVol * 0.65).toInt().coerceAtLeast(1),
                                  0
                              )
                          }

                          val mp = MediaPlayer()
                          mp.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          mp.setDataSource(tempFile.absolutePath)
                          mp.setOnCompletionListener {
                              it.release()
                              actionSound.release()
                          }
                          mp.prepare()
                          mp.start()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }
          """
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt_code)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
